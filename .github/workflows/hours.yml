# Opening hours from Google Maps.
# Every hour this reads the shop's hours from Google (special days included) and saves them as hours.json,
# which the Visit section shows. It needs a Places API (New) key saved as the repository secret GOOGLE_MAPS_KEY.
# One request an hour is about 744 a month, inside Google's free monthly amount for this kind of request.
name: Opening hours from Google Maps

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opening-hours
  cancel-in-progress: false

jobs:
  hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the hours from Google Maps
        id: fetch
        env:
          KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No GOOGLE_MAPS_KEY secret yet, nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS --fail-with-body \
            "https://places.googleapis.com/v1/places/ChIJyZhpr5hA0i0R7PMfYQ_Nhho" \
            -H "X-Goog-Api-Key: $KEY" \
            -H "X-Goog-FieldMask: businessStatus,regularOpeningHours.periods,currentOpeningHours.periods,currentOpeningHours.specialDays" \
            -o "$RUNNER_TEMP/place.json"
          python3 - "$RUNNER_TEMP/place.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          cur = r.get("currentOpeningHours") or {}
          out = {
              "source": "Google Maps",
              "businessStatus": r.get("businessStatus"),
              "regular": (r.get("regularOpeningHours") or {}).get("periods", []),
              "current": cur.get("periods", []),
              "specialDays": cur.get("specialDays", []),
          }
          json.dump(out, open("hours.json", "w"), indent=1, sort_keys=True)
          open("hours.json", "a").write("\n")
          PY

      - name: Publish when the hours changed
        if: steps.fetch.outputs.skip != '1'
        run: |
          git add hours.json
          if git diff --cached --quiet; then
            echo "Hours unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Opening hours from Google Maps"
          git push origin HEAD:main
          git push origin HEAD:gh-pages
